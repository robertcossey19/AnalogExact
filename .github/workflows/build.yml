name: Build AnalogExact

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  macos-universal:
    name: macOS Universal (VST3/AU/Standalone)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get JUCE (JUCE 8 for WebView)
        run: |
          rm -rf JUCE
          git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure (Universal)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Artifacts
        run: |
          set -e
          mkdir -p artifacts

          VST3_PATH="$(find build -type d -path "*_artefacts/Release/VST3/*.vst3" -maxdepth 8 | head -n 1)"
          AU_PATH="$(find build -type d -path "*_artefacts/Release/AU/*.component" -maxdepth 8 | head -n 1)"
          APP_PATH="$(find build -type d -path "*_artefacts/Release/Standalone/*.app" -maxdepth 8 | head -n 1)"

          echo "VST3: $VST3_PATH"
          echo "AU:   $AU_PATH"
          echo "APP:  $APP_PATH"

          if [ -n "$VST3_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$VST3_PATH" "artifacts/AnalogExact-macOS-Universal-VST3.zip"
          fi

          if [ -n "$AU_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$AU_PATH" "artifacts/AnalogExact-macOS-Universal-AU.zip"
          fi

          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/AnalogExact-macOS-Universal-Standalone.zip"
          fi

          ls -la artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnalogExact-macOS-Universal
          path: artifacts/*.zip

  windows:
    name: Windows (VST3 x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get JUCE (JUCE 8 for WebView)
        run: |
          if (Test-Path JUCE) { Remove-Item -Recurse -Force JUCE }
          git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 |
                 Where-Object { $_.FullName -match "_artefacts\\Release\\VST3" } |
                 Select-Object -First 1

          if ($null -eq $vst3) {
            Write-Host "No VST3 found!"
            exit 1
          }

          Write-Host "VST3: $($vst3.FullName)"
          Compress-Archive -Path $vst3.FullName -DestinationPath "artifacts\AnalogExact-windows-VST3.zip" -Force
          Get-ChildItem artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnalogExact-Windows
          path: artifacts/*.zip
