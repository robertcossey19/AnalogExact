name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Install WebView2
      shell: powershell
      run: |
        # Register NuGet source
        Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue
        
        # Install WebView2 package
        Install-Package Microsoft.Web.WebView2 -Source nugetRepository -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Force -SkipDependencies
        
        # Verify installation
        $webview2Path = "$env:USERPROFILE\.nuget\packages\microsoft.web.webview2"
        if (Test-Path $webview2Path) {
          Write-Host "WebView2 installed successfully at: $webview2Path"
          Get-ChildItem $webview2Path -Recurse -Depth 2
        } else {
          Write-Error "WebView2 installation failed"
          exit 1
        }
    
    - name: Configure CMake
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:USERPROFILE\.nuget\packages"
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload Windows VST3
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-Windows-VST3
        path: build/AnalogExact_artefacts/Release/VST3/AnalogExact.vst3

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Configure CMake (Universal Binary)
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Verify Universal Binary
      run: |
        echo "Checking VST3 architectures..."
        lipo -info build/AnalogExact_artefacts/Release/VST3/AnalogExact.vst3/Contents/MacOS/AnalogExact || true
        
        echo "Checking AU architectures..."
        lipo -info build/AnalogExact_artefacts/Release/AU/AnalogExact.component/Contents/MacOS/AnalogExact || true
    
    - name: Upload macOS VST3
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-macOS-VST3
        path: build/AnalogExact_artefacts/Release/VST3/AnalogExact.vst3
    
    - name: Upload macOS AU
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-macOS-AU
        path: build/AnalogExact_artefacts/Release/AU/AnalogExact.component
    
    - name: Upload Standalone
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-macOS-Standalone
        path: build/AnalogExact_artefacts/Release/Standalone/AnalogExact.app
