name: Build VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26'
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    
    - name: Build
      run: cmake --build build --config Release -j4
    
    - name: Upload macOS VST3
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-macOS-VST3
        path: build/AnalogExact_artefacts/Release/VST3/*.vst3
        
    - name: Upload macOS AU
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-macOS-AU
        path: build/AnalogExact_artefacts/Release/AU/*.component
        if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.26'
    
    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build --config Release
    
    - name: Upload Windows VST3
      uses: actions/upload-artifact@v4
      with:
        name: AnalogExact-Windows-VST3
        path: build/AnalogExact_artefacts/Release/VST3/*.vst3
